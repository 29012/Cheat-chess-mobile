name: Build ChessCoach APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Extract project
        run: |
          mkdir unpacked
          unzip -q ChessCoach_Android_Source.zip -d unpacked

      - name: Find Gradle project
        run: |
          PROJECT_FILE=$(find unpacked \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          [ -z "$PROJECT_FILE" ] && { echo "Gradle project not found"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> $GITHUB_ENV

      - name: Fix JVM target
        run: |
          cd "$PROJECT_DIR"
          for f in app/build.gradle app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$f"
            sed -i "s/jvmTarget = ['\"]1.8['\"]/jvmTarget = '17'/g" "$f"
            sed -i 's/JvmTarget.JVM_1_8/JvmTarget.JVM_17/g' "$f"
            grep -n -i "jvmTarget\|JavaVersion" "$f" || true
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessCoach-APK
          path: unpacked/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
